name: CI

on:
  push:
    branches: [main, "EX-*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法检查
        run: python -m py_compile main.py fetchers.py render.py safe_http.py wordfilter.py x-browser-service/scraper.py

      - name: 单元测试
        run: python -m unittest discover -s tests -t . -v
