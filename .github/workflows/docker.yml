name: Docker Image

# 把 x-browser-service 预先构建成镜像推到 GHCR，
# 用户 docker compose up -d 时直接拉取，不用在本机构建 chromium + pip 依赖。
on:
  push:
    branches: [main]
    # 只有镜像内容变了才重建：改 compose / 文档不用重跑（省 CI 时间）
    paths:
      - "x-browser-service/scraper.py"
      - "x-browser-service/Dockerfile"
      - ".github/workflows/docker.yml"
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    # Fork releases must not publish to the upstream maintainer's registry.
    if: github.repository == 'EndermanMYR/astrbot_plugin_link_preview'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/endermanmyr/astrbot-xbrowser
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ./x-browser-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
